<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>R.E.P.O. — Справочник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>🧟 <span>R.E.P.O.</span> Справочник</h1>
    <div class="hdr-count" id="count">—</div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="monsters">👾 Монстры</button>
    <button class="tab-btn" data-tab="improvements">💪 Улучшения</button>
    <button class="tab-btn" data-tab="weapons">🔫 Оружие</button>
    <button class="tab-btn" data-tab="drones">🤖 Дроны</button>
    <button class="tab-btn" data-tab="other">📦 Прочее</button>
    <button class="tab-btn" data-tab="tips">💡 Советы</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search" id="search" placeholder="Поиск...">
  </div>
  <div class="filters" id="filters"></div>
</div>

<main>
  <div class="list" id="list"></div>
</main>

<button class="btt" id="btt" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="img-overlay" id="imgOverlay">
  <button class="img-overlay-close" id="imgOverlayClose">✕</button>
  <img class="img-overlay-img" id="imgOverlayImg" src="" alt="">
</div>

<script src="env.js"></script>
<!-- ESM import -->
<!-- Supabase UMD (глобальный объект supabase) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>

</body>
</html>
